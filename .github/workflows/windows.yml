name: Windows desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: program/requirements*.txt
      - run: python -m pip install -r program/requirements-build.txt
      - run: python tests/test_generator.py
      - run: python tests/test_round_cover.py
      - run: python tests/test_desktop.py
      - name: Build standalone EXE
        working-directory: program
        run: python -m PyInstaller --noconfirm CoverGenerator.spec
      - name: Verify bundled geometry
        run: python tests/test_frozen.py program/dist/CoverGenerator.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CoverGenerator-Windows-x64
          path: program/dist/CoverGenerator.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CoverGenerator-Windows-x64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME release/CoverGenerator.exe --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME release/CoverGenerator.exe --verify-tag --title "Cover Generator $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
          }
